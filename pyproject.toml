[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pigproject"
version = "0.1.0"
description = "Pig farm chamber-level anomaly detection with Isolation Forest and LSTM Autoencoder."
readme = "README.md"
requires-python = ">=3.9,<3.12"
dependencies = [
    "joblib>=1.3",
    "numpy>=1.23",
    "pandas>=1.5",
    "pillow>=10",
    "scikit-learn>=1.2",
    "tensorflow>=2.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "httpx>=0.27",
]
yolo = [
    "ultralytics>=8.3",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
pig-preprocess = "pigproject.preprocess:main"
pig-train = "pigproject.train:main"
pig-detect = "pigproject.detect:main"
pig-iforest = "pigproject.baseline:main"
pig-make-sample = "pigproject.sample_data:main"
pig-analyze-sample = "pigproject.sample_analysis:main"
pig-aihub = "pigproject.aihub_client:main"
pig-normalize = "pigproject.normalize:main"
pig-validate-data = "pigproject.validate_data:main"
pig-build-bioenergy = "pigproject.bioenergy_pipeline:main"
pig-bioenergy-report = "pigproject.bioenergy_report:main"
pig-threshold-compare = "pigproject.threshold_compare:main"
pig-build-clean-baseline = "pigproject.bioenergy_baseline:main"
pig-baseline-overview = "pigproject.bioenergy_baseline_overview:main"
pig-explain-bioenergy = "pigproject.bioenergy_explain:main"
pig-temperature-timeline = "pigproject.temperature_timeline:main"
pig-temperature-window-scatter = "pigproject.temperature_window_scatter:main"
pig-build-activity = "pigproject.activity_features:main"
pig-resample-activity = "pigproject.resample_activity:main"
pig-apply-rules = "pigproject.domain_rules:main"
pig-hotpig-sanity-check = "pigproject.hotpig_sanity_check:main"
pig-hotpig-evaluate = "pigproject.hotpig_evaluate:main"
pig-build-behavior-heat-tolerance = "pigproject.behavior_heat_tolerance:main"
pig-compare-behavior-heat-tolerance = "pigproject.behavior_heat_tolerance_compare:main"
pig-keypoint-to-yolo = "pigproject.keypoint_to_yolo:main"
pig-build-yolo-dataset = "pigproject.build_yolo_dataset:main"
pig-build-activity-model = "pigproject.activity_model_dataset:main"
pig-activity-report = "pigproject.activity_report:main"
pig-final-ensemble = "pigproject.final_ensemble:main"
pig-asf-dryad-analysis = "pigproject.asf_dryad_analysis:main"
pig-external-validation-summary = "pigproject.external_validation_summary:main"
pig-profile-aihub-71471 = "pigproject.aihub_71471_profile:main"
pig-build-aihub-71471-timeseries = "pigproject.aihub_71471_timeseries:main"
pig-compare-aihub-71471-622 = "pigproject.aihub_71471_compatibility:main"
pig-aihub-71471-baseline = "pigproject.aihub_71471_baseline:main"
pig-farm-events = "pigproject.farm_event_schema:main"
pig-compare-rule-upgrade = "pigproject.rule_upgrade_compare:main"
pig-build-synthetic-rule-events = "pigproject.synthetic_rule_events:main"
pig-evaluate-synthetic-rule-events = "pigproject.synthetic_rule_evaluation:main"
pig-category-lead-time = "pigproject.category_lead_time_report:main"
pig-build-synthetic-management-scenario = "pigproject.synthetic_management_scenario:main"
pig-action-queues = "pigproject.action_queue_report:main"
pig-build-incident-review-log = "pigproject.incident_review:main"
pig-rule-tuning-recommendations = "pigproject.rule_tuning_recommendation:main"
pig-build-sample-review-scenario = "pigproject.sample_review_scenario:main"
pig-rule-threshold-experiment = "pigproject.rule_threshold_experiment:main"
pig-build-rule-candidate-config = "pigproject.rule_candidate_config:main"
pig-compare-rule-configs = "pigproject.rule_config_compare:main"
pig-build-clearfarm-pen-day = "pigproject.clearfarm_processing:main"
pig-normalize-stress-biosensor = "pigproject.wearable_stress_biosensor_normalize:main"
pig-build-stress-biosensor-dataset = "pigproject.wearable_stress_biosensor_dataset:main"
pig-evaluate-stress-biosensor = "pigproject.wearable_stress_biosensor_evaluate:main"
pig-prrsv-play-analysis = "pigproject.prrsv_play_study_analysis:main"
pig-build-rfid-movement-features = "pigproject.rfid_lorawan_movement_features:main"
pig-build-feeding-reference = "pigproject.pig_feeding_behavior_reference:main"
pig-validate-clearfarm-rules = "pigproject.clearfarm_rule_validation:main"
pig-clearfarm-rule-scorecard = "pigproject.clearfarm_rule_scorecard:main"
pig-clearfarm-alert-policy = "pigproject.clearfarm_alert_policy:main"
pig-clearfarm-action-adapter = "pigproject.clearfarm_action_queue_adapter:main"
pig-multimodal-behavior-baseline = "pigproject.multimodal_behavior_baseline:main"
pig-serve-api = "pigproject.api:main"
pig-build-clearfarm-baseline = "pigproject.clearfarm_baseline:main"
pig-evaluate-clearfarm-baseline = "pigproject.clearfarm_baseline_evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
